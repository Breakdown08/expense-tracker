[project]
name = "expense-tracker"
version = "0.1.0"
description = "Family expense tracker: a Telegram bot with a LangChain agent and a LangGraph posting flow"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram>=3.31.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
expense-tracker = "expense_tracker.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

# Every variable, parameter and return value is typed. mypy --strict covers signatures;
# tests/test_annotations.py covers variables, which no linter checks.
[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
