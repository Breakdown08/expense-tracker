[project]
name = "expense-tracker"
version = "0.1.0"
description = "Family expense tracker: a Telegram bot with a LangChain agent and a LangGraph posting flow"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.1",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "tzdata>=2026.6",
]

[project.scripts]
expense-tracker = "expense_tracker.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

# Every variable, parameter and return value is typed. ty is the reference checker; mypy --strict
# stays for its pydantic plugin (constructor arguments). tests/test_annotations.py covers variables,
# which no checker requires.
[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true


# CLI only (`uv run alembic revision --autogenerate -m ...`); the bot upgrades itself at start.
# The URL comes from DATABASE_URL, see migrations/env.py.
[tool.alembic]
script_location = "%(here)s/src/expense_tracker/migrations"
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s"
